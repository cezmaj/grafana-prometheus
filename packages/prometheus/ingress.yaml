apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: xxxxxxxxxxxxxxxxxxxxxxxxxxxx
spec:
  ingressClassName: nginx
  rules:
    - host: xxxxxxxxxxxxxxxxxxx
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-server
                port:
                  number: 80
  tls:
    - secretName: prometheus-tls-le
      hosts:
        -  xxxxxxxxxxxxxxxxxxxxxxxxxxxx
